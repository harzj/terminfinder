name: Stündlicher Kalender-Sync

on:
  schedule:
    - cron: '*/15 * * * *' # Alle 15 Minuten
  workflow_dispatch: # Manueller Trigger zum Testen

jobs:
  autosync:
    runs-on: ubuntu-latest
    steps:
      - name: Kalender-Sync auslösen
        run: |
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "Fehler: GitHub secret CRON_SECRET fehlt oder ist leer"
            exit 1
          fi

          STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -L \
            -X GET \
            "https://lass-treffen.de/api/calendar/autosync?secret=${{ secrets.CRON_SECRET }}")
          cat /tmp/response.json
          if [ "$STATUS" != "200" ]; then
            echo "Fehler: HTTP $STATUS"
            exit 1
          fi
